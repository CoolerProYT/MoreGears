# Builds the VitePress wiki in docs/ and publishes it to GitHub Pages.
# One-time setup: repository Settings > Pages > Source: "GitHub Actions".
name: Docs

# Each Minecraft version lives on its own branch, so the wiki is published from one of them: the branch named by the
# DOCS_BRANCH repository variable (Settings > Secrets and variables > Actions > Variables), or the default branch when
# that variable isn't set. Pushes to any other branch are ignored, so porting old versions never replaces the live wiki.
# A manual run deploys whatever branch it is started from. GitHub only offers the manual button once this file is on
# the default branch.
on:
  push:
    paths:
      - 'docs/**'
      - 'common/src/generated/resources/**'
      - 'common/src/main/java/com/coolerpromc/moregears/item/**'
      - 'common/src/main/java/com/coolerpromc/moregears/tool/**'
      - 'common/src/main/java/com/coolerpromc/moregears/armor/**'
      - 'common/src/main/resources/assets/moregears/lang/en_us.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.ref_name == (vars.DOCS_BRANCH || github.event.repository.default_branch)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - run: npm ci

      # Runs the data sync first. Served from the root of a custom (sub)domain, so no /MoreGears/ prefix.
      # Remove DOCS_BASE to go back to https://<user>.github.io/MoreGears/.
      - run: npm run build
        env:
          DOCS_BASE: /

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
